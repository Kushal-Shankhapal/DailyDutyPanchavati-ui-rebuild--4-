# Render Blueprint — the demo deployment of the daily duty chart app.
#
# One web service (this repo: Fastify + the server-rendered ChartDocument) plus one managed
# PostgreSQL. Differences from a local run, all of them environment only — no code branch:
#   · HOST=0.0.0.0   the local default is loopback (the chart is not reachable from the LAN);
#                    on Render the platform proxies in from outside the container.
#   · DATABASE_URL   supplied by the database below; server/db.ts uses the URL's own database
#                    instead of the local panchavati3_dev/panchavati3_test names.
#   · migrations     run in the pre-deploy phase so Render's free build container
#                    (which times out the DB connection) is not blocked by schema/seed work.
#   · data           seeded by the pre-deploy — WITH THE USER'S EXPLICIT AUTHORIZATION (2026-10-13):
#                    the 10/09 chart is the station's real allocation and the user authorised it on
#                    the demo deployment. PANCHAVATI_KEEP_EXISTING=1 makes the seed skip a chart that
#                    is already populated, so a redeploy can never wipe the clerk's edits.
#                    (Recorded in docs/OPEN_QUESTIONS.md T23 + docs/DEPLOY.md; AGENTS.md's data rule
#                    is unchanged for every other environment.)
#
# The legacy six-page reference chart is a SEPARATE app with its own database and repository
# (…/DailyDutyPanchavati-ui-rebuild, which carries its own render.yaml). Deploy it as a second
# service if the demo needs it, then point this service's LEGACY_URL at it:
#     LEGACY_URL=https://<legacy-service>.onrender.com
# With no LEGACY_URL (or LEGACY_URL=none) the /legacy/<date> entry stays a clear 404 instead of a
# dead link to a laptop's localhost.
services:
  - type: web
    name: daily-duty-panchavati
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev
    preDeployCommand: npm run db:migrate && npm run db:seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: PGSSLMODE
        value: require
      # never wipe a populated demo chart on redeploy (db/seed-chart-1009.ts)
      - key: PANCHAVATI_KEEP_EXISTING
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: panchavati-demo-db
          property: connectionString

databases:
  - name: panchavati-demo-db
    plan: free
    postgresMajorVersion: "17"

github:
  - repo: Kushal-Shankhapal/DailyDutyPanchavati-ui-rebuild--4-
    branch: main
    deploy:
      - .render.yaml